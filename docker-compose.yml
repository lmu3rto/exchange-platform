version: '3.8'

services:
  backend:
    build: .
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://mu3rto:platform_password@database:5432/exchange_platform?sslmode=disable
    restart: unless-stopped

  migration:
    image: migrate/migrate
    command:
      - -path=migrations
      - -database
      - postgres://mu3rto:platform_password@database:5432/exchange_platform?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data-new:/var/lib/postgresql

volumes:
  db-data-new:
